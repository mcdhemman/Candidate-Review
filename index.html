<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Work Style Discussion Profile | Deerpoint Group, LLC</title>
<style>
  .viz-root, body {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --page: #f9f9f7;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --band: #f0efec;
    --series-1: #2a78d6;
    --good: #0ca30c;
    --good-text: #006300;
    --serious: #ec835a;
    --border: rgba(11,11,11,0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) body {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --page: #0d0d0d;
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --baseline: #383835;
      --band: #383835;
      --series-1: #3987e5;
      --good: #0ca30c;
      --good-text: #0ca30c;
      --serious: #ec835a;
      --border: rgba(255,255,255,0.10);
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page); color: var(--ink);
    line-height: 1.5; padding: 24px 16px 64px;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .brand img { width: 58px; height: 58px; }
  .brand .bname { font-weight: 700; font-size: 1.05rem; }
  .brand .bsub { color: var(--ink-2); font-size: .82rem; }
  .card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 24px; margin-bottom: 20px;
  }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  h2 { font-size: 1.1rem; margin: 0 0 10px; }
  .sub { color: var(--ink-2); font-size: .92rem; }
  .muted { color: var(--muted); font-size: .85rem; }
  .disclaimer { color: var(--muted); font-size: .8rem; margin-top: 28px; }
  button {
    font: inherit; border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 18px; cursor: pointer; background: var(--surface-1); color: var(--ink);
  }
  button.primary { background: var(--series-1); border-color: var(--series-1); color: #fff; font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  input[type=text], textarea {
    font: inherit; width: 100%; padding: 9px 11px; border-radius: 8px;
    border: 1px solid var(--baseline); background: var(--surface-1); color: var(--ink);
  }
  .item { padding: 14px 0; border-bottom: 1px solid var(--grid); }
  .item:last-child { border-bottom: none; }
  .stem { margin-bottom: 8px; font-size: .96rem; }
  .likert { display: flex; gap: 6px; flex-wrap: wrap; }
  .likert label {
    flex: 1 1 0; min-width: 92px; text-align: center; font-size: .78rem; color: var(--ink-2);
    border: 1px solid var(--baseline); border-radius: 8px; padding: 8px 4px; cursor: pointer;
    min-height: 44px; display: flex; align-items: center; justify-content: center;
  }
  .likert input { position: absolute; opacity: 0; }
  .likert label:has(input:checked) { background: var(--series-1); border-color: var(--series-1); color: #fff; font-weight: 600; }
  .progress { height: 4px; background: var(--grid); border-radius: 2px; margin: 14px 0 4px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--series-1); width: 0%; }
  .code-box { font-family: ui-monospace, monospace; font-size: .78rem; word-break: break-all;
    background: var(--band); border-radius: 8px; padding: 12px; max-height: 150px; overflow: auto; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .hidden { display: none; }

  /* ---- reviewer profile chart (bullet rows vs target band) ---- */
  .dimrow { display: grid; grid-template-columns: 168px 1fr 88px; gap: 10px; align-items: center; padding: 7px 0; }
  .dimlabel { font-size: .85rem; color: var(--ink-2); }
  .track { position: relative; height: 18px; }
  .track .rail { position: absolute; left: 0; right: 0; top: 8px; height: 2px; background: var(--grid); border-radius: 1px; }
  .track .bandfill { position: absolute; top: 3px; height: 12px; background: var(--band); border-radius: 4px; }
  .track .dot { position: absolute; top: 4px; width: 10px; height: 10px; border-radius: 50%;
    background: var(--series-1); box-shadow: 0 0 0 2px var(--surface-1); transform: translateX(-50%); }
  .dimval { font-size: .85rem; font-variant-numeric: tabular-nums; text-align: right; }
  .flag { font-size: .74rem; font-weight: 600; margin-left: 6px; white-space: nowrap; }
  .flag.out { color: var(--serious); }
  .flag.in { color: var(--good-text); }
  .cand-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .probes { margin-top: 12px; border-top: 1px solid var(--grid); padding-top: 10px; }
  .probes p { font-size: .88rem; margin-bottom: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--grid); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  th { color: var(--ink-2); font-weight: 600; }
  .legendline { font-size: .78rem; color: var(--muted); margin: 6px 0 14px; }
  .legendline .swatch-band { display: inline-block; width: 22px; height: 10px; background: var(--band); border-radius: 3px; vertical-align: middle; margin: 0 4px; }
  .legendline .swatch-dot { display: inline-block; width: 9px; height: 9px; background: var(--series-1); border-radius: 50%; vertical-align: middle; margin: 0 4px; }
</style>

function scoreAnswers(answers){
  // answers: array of 1-5 aligned to ITEMS order
  const sums={}, counts={};
  ITEMS.forEach((it,i)=>{
    const [dim,,rev]=it;
    let v=answers[i];
    if(v==null) return;
    if(rev) v=6-v;
    sums[dim]=(sums[dim]||0)+v; counts[dim]=(counts[dim]||0)+1;
  });
  const out={};
  DIMS.forEach(d=>{
    if(counts[d.key]) out[d.key]=Math.round(((sums[d.key]/counts[d.key])-1)/4*100);
  });
  return out;
}

function encodeResult(name, answers){
  const payload={v:1,name:name,date:new Date().toISOString().slice(0,10),answers:answers};
  return btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
}
function decodeResult(code){
  const payload=JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
  if(payload.v!==1||!Array.isArray(payload.answers)||payload.answers.length!==ITEMS.length)
    throw new Error("bad format");
  return payload;
}

const DISCLAIMER = `This questionnaire is a structured discussion tool used to guide interview conversations.
It is not a validated psychometric test, it is scored the same way for every candidate, and it is never
used on its own to make a hiring decision. No responses are stored by this page; your answers exist only
in the results code you choose to share.`;

/* ---------------- candidate flow ---------------- */
function renderIntro(){
  app.innerHTML = `
    <div class="card">
      ${brandHeader()}
      <h1>Work Style Discussion Profile</h1>
      <p class="sub" style="margin-top:6px">Thank you for your interest in a ${esc(CONFIG.roleTitle)} with Deerpoint Group (DPG).
      This questionnaire comes to you directly from DPG. It takes about 10 minutes and helps structure our conversation
      about how you prefer to work. There are no right or wrong answers - please respond as you actually are,
      not as you think the role requires.</p>
      <p class="sub" style="margin-top:10px"><strong>Before you begin:</strong> answer quickly and honestly;
      your first instinct is usually the most accurate. All candidates receive the identical questionnaire.</p>
      <div style="margin-top:16px">
        <label for="cname" class="sub"><strong>Your name</strong></label>
        <input type="text" id="cname" autocomplete="name" style="max-width:340px; margin-top:6px">
      </div>
      <div style="margin-top:18px"><button class="primary" id="startBtn">Begin</button></div>
      <p class="disclaimer">${DISCLAIMER}</p>
    </div>`;
  document.getElementById("startBtn").onclick=()=>{
    const name=document.getElementById("cname").value.trim();
    if(!name){ alert("Please enter your name."); return; }
    renderQuiz(name);
  };
}

function renderQuiz(name){
  const items=ITEMS.map((it,i)=>`
    <div class="item" data-i="${i}">
      <div class="stem">${i+1}. ${esc(it[1])}</div>
      <div class="likert">
        ${LIKERT.map((l,v)=>`<label><input type="radio" name="q${i}" value="${v+1}"><span>${l}</span></label>`).join("")}
      </div>
    </div>`).join("");
  app.innerHTML = `
    <div class="card">
      ${brandHeader()}
      <h2>Work Style Questionnaire</h2>
      <p class="sub">Rate how well each statement describes you.</p>
      <div class="progress"><div id="pbar"></div></div>
      <p class="muted" id="pcount">0 of ${ITEMS.length} answered</p>
      ${items}
      <div style="margin-top:18px" class="row">
        <button class="primary" id="submitBtn" disabled>Submit</button>
        <span class="muted" id="submitHint">Answer every statement to submit.</span>
      </div>
      <p class="disclaimer">${DISCLAIMER}</p>
    </div>`;
  const update=()=>{
    const n=[...app.querySelectorAll("input:checked")].length;
    document.getElementById("pbar").style.width=(n/ITEMS.length*100)+"%";
    document.getElementById("pcount").textContent=`${n} of ${ITEMS.length} answered`;
    document.getElementById("submitBtn").disabled = n<ITEMS.length;
    document.getElementById("submitHint").style.display = n<ITEMS.length ? "" : "none";
  };
  app.addEventListener("change",update);
  document.getElementById("submitBtn").onclick=()=>{
    const answers=ITEMS.map((_,i)=>{
      const el=app.querySelector(`input[name=q${i}]:checked`);
      return el?parseInt(el.value,10):null;
    });
    renderDone(name, encodeResult(name, answers));
  };
  window.scrollTo(0,0);
}

function renderDone(name, code){
  const mailBtn = CONFIG.replyEmail
    ? `<a href="mailto:${encodeURIComponent(CONFIG.replyEmail)}?subject=${encodeURIComponent("Work Style Profile - "+name)}&body=${encodeURIComponent(code)}"><button class="primary">Email my results</button></a>`
    : "";
  app.innerHTML = `
    <div class="card">
      ${brandHeader()}
      <h1>Thank you, ${esc(name)}.</h1>
      <p class="sub" style="margin:10px 0">Your questionnaire is complete. Copy the results code below and email it back
      to your Deerpoint Group contact. Your responses are not stored on this page or anywhere else.</p>
      <div class="code-box" id="codeBox">${esc(code)}</div>
      <div class="row" style="margin-top:12px">
        <button id="copyBtn">Copy code</button>
        ${mailBtn}
        <span class="muted hidden" id="copied">Copied.</span>
      </div>
      <p class="disclaimer">${DISCLAIMER}</p>
    </div>`;
  document.getElementById("copyBtn").onclick=async()=>{
    try{ await navigator.clipboard.writeText(code); }
    catch(e){ const r=document.createRange(); r.selectNodeContents(document.getElementById("codeBox"));
      const s=getSelection(); s.removeAllRanges(); s.addRange(r); document.execCommand("copy"); }
    document.getElementById("copied").classList.remove("hidden");
  };
  window.scrollTo(0,0);
}

/* ---------------- reviewer dashboard ---------------- */
let loaded=[]; // {name, date, scores}

function bulletRow(dim, score){
  const [lo,hi]=CONFIG.targets[dim.key];
  const inBand = score>=lo && score<=hi;
  return `
    <div class="dimrow" title="${esc(dim.name)}: ${score} (target ${lo}-${hi})">
      <div class="dimlabel">${esc(dim.name)}</div>
      <div class="track">
        <div class="rail"></div>
        <div class="bandfill" style="left:${lo}%; width:${hi-lo}%"></div>
        <div class="dot" style="left:${score}%"></div>
      </div>
      <div class="dimval">${score}<span class="flag ${inBand?"in":"out"}">${inBand?"&#10003; in range":"&#9650; discuss"}</span></div>
    </div>`;
}

function probesFor(scores){
  const out=[];
  DIMS.forEach(d=>{
    const [lo,hi]=CONFIG.targets[d.key];
    const s=scores[d.key];
    if(s<lo && d.lowProbe) out.push(d.lowProbe);
    if(s>hi && d.highProbe) out.push(d.highProbe);
  });
  return out;
}

function renderReview(){
  const cards = loaded.map((c,idx)=>{
    const probes = probesFor(c.scores);
    return `
    <div class="card">
      <div class="cand-head">
        <h2>${esc(c.name)}</h2>
        <span class="muted">completed ${esc(c.date)} &nbsp;
          <button data-rm="${idx}" style="padding:3px 10px; font-size:.78rem">remove</button></span>
      </div>
      ${DIMS.map(d=>bulletRow(d, c.scores[d.key])).join("")}
      ${probes.length?`<div class="probes"><strong class="sub">Suggested interview probes</strong>
        ${probes.map(p=>`<p>&#9650; ${esc(p)}</p>`).join("")}</div>`:""}
    </div>`;
  }).join("");

  const table = loaded.length ? `
    <div class="card">
      <h2>Score table</h2>
      <table>
        <tr><th>Dimension</th><th class="num">Target</th>${loaded.map(c=>`<th class="num">${esc(c.name.split(" ")[0])}</th>`).join("")}</tr>
        ${DIMS.map(d=>{
          const [lo,hi]=CONFIG.targets[d.key];
          return `<tr><td>${esc(d.name)}</td><td class="num">${lo}-${hi}</td>${
            loaded.map(c=>`<td class="num">${c.scores[d.key]}</td>`).join("")}</tr>`;
        }).join("")}
      </table>
    </div>` : "";

  app.innerHTML = `
    <div class="card">
      ${brandHeader()}
      <h1>Reviewer Dashboard</h1>
      <p class="sub">Paste a candidate's results code below. Profiles are scored on this page only - nothing is uploaded or stored.</p>
      <div class="legendline"><span class="swatch-band"></span> target range for the role &nbsp;&nbsp;<span class="swatch-dot"></span> candidate self-report (0-100)</div>
      <textarea id="codeIn" rows="3" placeholder="Paste results code"></textarea>
      <div class="row" style="margin-top:10px">
        <button class="primary" id="addBtn">Add candidate</button>
        <span class="muted" id="err"></span>
      </div>
    </div>
    ${cards}
    ${table}
    <p class="disclaimer">Self-reported work-style questionnaire. Not a validated psychometric instrument;
    use to structure interviews and reference checks, never as a standalone selection screen.
    Apply the identical process to every candidate.</p>`;
  document.getElementById("addBtn").onclick=()=>{
    const code=document.getElementById("codeIn").value;
    try{
      const p=decodeResult(code);
      loaded.push({name:p.name, date:p.date, scores:scoreAnswers(p.answers)});
      renderReview();
    }catch(e){ document.getElementById("err").textContent="That code could not be read - check it was copied completely."; }
  };
  app.querySelectorAll("button[data-rm]").forEach(b=>{
    b.onclick=()=>{ loaded.splice(parseInt(b.dataset.rm,10),1); renderReview(); };
  });
}

/* ---------------- router ---------------- */
function route(){
  if(location.hash==="#review") renderReview();
  else renderIntro();
}
window.addEventListener("hashchange",route);
route();
</script>

</html>
